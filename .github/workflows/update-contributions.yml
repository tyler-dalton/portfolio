name: Update Contribution Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

# One graph update at a time. A second run waits, then checks out the result of the first.
concurrency:
  group: update-contribution-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: tyler-dalton
        run: node scripts/contributions.mjs

      - name: Generate analytics snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types scripts/analytics.mjs

      - name: Check analytics model
        run: node --experimental-strip-types --test src/lib/github-analytics.test.ts

      - name: Commit updated graph and analytics
        run: |
          if [ -z "$(git status --porcelain public/github/contributions.svg src/data/github-analytics.json)" ]; then
            echo "Contribution graph and analytics snapshot have not changed."
            exit 0
          fi

          if ! grep -q 'data-date=' public/github/contributions.svg; then
            echo "Refusing to commit a contribution graph with no dated cells."
            exit 1
          fi

          if ! grep -q '"contributionDays"' src/data/github-analytics.json; then
            echo "Refusing to commit an analytics snapshot with no contribution days."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/github/contributions.svg src/data/github-analytics.json
          git commit -m "chore(git contributions): update contribution graph and analytics snapshot"
          git push