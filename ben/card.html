<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2c3e50">
  <meta name="description" content="Connect with Ben Morneau, a Finance and Economics student at the University of Cincinnati.">
  <meta property="og:title" content="Ben Morneau | Digital Business Card">
  <meta property="og:description" content="Finance and Economics student at the University of Cincinnati.">
  <meta property="og:type" content="website">
  <title>Ben Morneau | Digital Business Card</title>
  <!-- TODO: Make Ben a Favicon -->
  <link rel="icon" type="image/svg+xml" href="media/ben-favicon.svg">
  <link rel="stylesheet" href="css/card.css">
  <script src="javascript/card.js" defer></script>
</head>
<body>
  <main class="business-card-page">
    <article class="business-card" aria-labelledby="card-name">
      <div class="hero-image">
        <img src="media/ben-headshot.png" alt="Ben Morneau" width="160" height="160">
      </div>
      <h1 id="card-name">Ben Morneau</h1>
      <p class="card-role">Finance + Economics</p>
      <p class="card-school">University of Cincinnati</p>
      <div class="contact-actions">
        <!--- TODO: Make Ben vcf card with info -->
        <a class="btn contact-btn" href="media/ben-morneau.vcf" download="Ben-Morneau.vcf">Save Contact</a>
        <a class="btn contact-btn" href="mailto:morneauben1@gmail.com">Send Email</a>
      </div>
      <nav class="contact-grid" aria-label="Connect with Ben">
        <a class="contact-card linkedin" href="https://linkedin.com/in/ben-morneau/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)">
          <img src="media/linkedin.svg" alt="">
          <h2>LinkedIn</h2>
        </a>
        <!-- TODO: need to find something else to put here -->
        <a class="contact-card github" href="https://github.com/tyler-dalton" target="_blank" rel="noopener noreferrer" aria-label="GitHub (opens in a new tab)">
          <img src="media/github.svg" alt="">
          <h2>GitHub</h2>
        </a>
      </nav>
      <div class="share-actions">
        <button id="share-card" type="button" hidden>Share Card</button>
        <p id="share-status" role="status"></p>
        <div id="share-fallback" hidden>
          <label for="card-url">Copy this link to share</label>
          <input id="card-url" type="text" readonly>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
