name: Update Contribution Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: tyler-dalton
        run: node scripts/contributions.mjs

      - name: Commit updated graph
        run: |
          if [ -z "$(git status --porcelain public/github/contributions.svg)" ]; then
            echo "Contribution graph has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/github/contributions.svg
          git commit -m "chore(git contributions): update contribution graph svg"
          git push